
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Billing | Decora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body>

<div class="page-container">

    <header class="page-header">
        <a href="index.html" class="back-link">
            <i class="bi bi-arrow-left"></i> Dashboard
        </a>
        <div class="page-brand">Decora</div>
        <span class="page-label">POINT OF SALE</span>
    </header>

    <main class="page-content">

        <div class="page-title">
            <div>
                <span class="eyebrow">SALES & TRANSACTIONS</span>
                <h1>Create New Bill</h1>
                <p>Manage event services, decoration items and payments.</p>
            </div>
            <div class="title-icon"><i class="bi bi-receipt-cutoff"></i></div>
        </div>

        <div class="billing-layout">

            <div class="billing-main">

                <section class="form-card">
                    <h3><i class="bi bi-person-circle"></i> Customer Details</h3>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label>Customer Name</label>
                            <input type="text" class="form-control" placeholder="Enter customer name">
                        </div>

                        <div class="col-md-6">
                            <label>Contact Number</label>
                            <input type="tel" class="form-control" placeholder="Enter contact number">
                        </div>
                    </div>
                </section>

                <section class="form-card">
                    <div class="section-heading">
                        <h3><i class="bi bi-box-seam"></i> Select Items & Services</h3>
                    </div>

                    <div class="billing-search">
                        <i class="bi bi-search"></i>
                        <input type="text" id="productSearch" placeholder="Search items...">
                    </div>

                    <div class="category-filter">
                        <button class="category-btn active" data-category="all">All</button>
                        <button class="category-btn" data-category="decoration">Decoration</button>
                        <button class="category-btn" data-category="lighting">Lighting</button>
                        <button class="category-btn" data-category="furniture">Furniture</button>
                    </div>

                    <div class="product-grid" id="productGrid">

                        <button class="product-card" data-name="Flower Stand" data-price="5000" data-category="decoration">
                            <i class="bi bi-flower1"></i>
                            <h5>Flower Stand</h5>
                            <p>Rs. 5,000</p>
                        </button>

                        <button class="product-card" data-name="Balloon Decoration" data-price="8000" data-category="decoration">
                            <i class="bi bi-balloon"></i>
                            <h5>Balloon Decoration</h5>
                            <p>Rs. 8,000</p>
                        </button>

                        <button class="product-card" data-name="LED Lights" data-price="3500" data-category="lighting">
                            <i class="bi bi-lightbulb"></i>
                            <h5>LED Lights</h5>
                            <p>Rs. 3,500</p>
                        </button>

                        <button class="product-card" data-name="Stage Sofa" data-price="12000" data-category="furniture">
                            <i class="bi bi-house"></i>
                            <h5>Stage Sofa</h5>
                            <p>Rs. 12,000</p>
                        </button>

                        <button class="product-card" data-name="Table Decoration" data-price="2500" data-category="decoration">
                            <i class="bi bi-stars"></i>
                            <h5>Table Decoration</h5>
                            <p>Rs. 2,500</p>
                        </button>

                        <button class="product-card" data-name="Chandelier" data-price="7500" data-category="lighting">
                            <i class="bi bi-brightness-high"></i>
                            <h5>Chandelier</h5>
                            <p>Rs. 7,500</p>
                        </button>

                    </div>
                </section>

            </div>


            <aside class="cart-card">

                <h3><i class="bi bi-cart3"></i> Current Bill</h3>

                <div class="bill-number">
                    <span>Invoice No.</span>
                    <strong>DEC-0001</strong>
                </div>

                <div id="cartItems" class="cart-items">
                    <div class="empty-cart">
                        <i class="bi bi-cart-x"></i>
                        <p>No items added yet</p>
                    </div>
                </div>

                <div class="bill-summary">
                    <div>
                        <span>Subtotal</span>
                        <strong id="subtotal">Rs. 0</strong>
                    </div>

                    <div class="discount-row">
                        <label for="discount">Discount (Rs.)</label>
                        <input type="number" id="discount" value="0" min="0">
                    </div>

                    <div class="total-row">
                        <span>Total</span>
                        <strong id="total">Rs. 0</strong>
                    </div>
                </div>

                <label>Payment Method</label>
                <select class="form-select mb-3" id="paymentMethod">
                    <option>Cash</option>
                    <option>Card</option>
                    <option>Bank Transfer</option>
                </select>

                <button class="primary-btn w-100" id="completeBill">
                    <i class="bi bi-check-circle"></i> Complete Bill
                </button>

                <button class="clear-btn w-100 mt-2" id="clearBill">
                    Clear Bill
                </button>

            </aside>

        </div>
    </main>
</div>

<script>
const cart = [];
const cartItems = document.getElementById("cartItems");
const subtotalElement = document.getElementById("subtotal");
const totalElement = document.getElementById("total");
const discountInput = document.getElementById("discount");

function formatMoney(amount) {
    return "Rs. " + amount.toLocaleString("en-LK");
}

function renderCart() {
    cartItems.innerHTML = "";

    if (cart.length === 0) {
        cartItems.innerHTML = `
            <div class="empty-cart">
                <i class="bi bi-cart-x"></i>
                <p>No items added yet</p>
            </div>`;
    }

    let subtotal = 0;

    cart.forEach((item, index) => {
        subtotal += item.price * item.quantity;

        cartItems.innerHTML += `
            <div class="cart-item">
                <div class="cart-item-details">
                    <h5>${item.name}</h5>
                    <p>${formatMoney(item.price)}</p>
                    <div class="quantity-controls">
                        <button onclick="changeQuantity(${index}, -1)">−</button>
                        <span>${item.quantity}</span>
                        <button onclick="changeQuantity(${index}, 1)">+</button>
                    </div>
                </div>
                <button class="remove-item" onclick="removeItem(${index})">
                    <i class="bi bi-trash"></i>
                </button>
            </div>`;
    });

    const discount = Math.min(
        Math.max(0, Number(discountInput.value) || 0),
        subtotal
    );

    subtotalElement.textContent = formatMoney(subtotal);
    totalElement.textContent = formatMoney(subtotal - discount);
}

document.querySelectorAll(".product-card").forEach(button => {
    button.addEventListener("click", () => {
        const name = button.dataset.name;
        const price = Number(button.dataset.price);

        const existing = cart.find(item => item.name === name);

        if (existing) {
            existing.quantity++;
        } else {
            cart.push({ name, price, quantity: 1 });
        }

        renderCart();
    });
});

function changeQuantity(index, amount) {
    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    renderCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
}

discountInput.addEventListener("input", renderCart);

document.getElementById("clearBill").addEventListener("click", () => {
    cart.length = 0;
    discountInput.value = 0;
    renderCart();
});

document.getElementById("completeBill").addEventListener("click", () => {
    if (cart.length === 0) {
        alert("Please add items to the bill first.");
        return;
    }

    alert("Bill created successfully! Connect a database to save this transaction.");
});

const searchInput = document.getElementById("productSearch");
let selectedCategory = "all";

function filterProducts() {
    const search = searchInput.value.toLowerCase();

    document.querySelectorAll(".product-card").forEach(card => {
        const matchesName = card.dataset.name.toLowerCase().includes(search);
        const matchesCategory = selectedCategory === "all" ||
            card.dataset.category === selectedCategory;

        card.style.display = matchesName && matchesCategory ? "" : "none";
    });
}

searchInput.addEventListener("input", filterProducts);

document.querySelectorAll(".category-btn").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelector(".category-btn.active").classList.remove("active");
        button.classList.add("active");
        selectedCategory = button.dataset.category;
        filterProducts();
    });
});

renderCart();
</script>

</body>
</html>
