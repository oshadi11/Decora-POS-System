<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>Decora</title>
</head>

<body>
    <div class="main-container">
        <div class="side-bar">
            <div class="logo">
                <img src="img/logo.png" alt="">
                <h2 class="logo-name">Decora</h2>
            </div>
            <div class="sidebar-menu">

                <a href="#" class="menu-item active">
                    <div class="menu-item-icon">
                        <i class="bi bi-grid-fill"></i>
                    </div>
                    <div class="menu-item-text">Dashboard</div>
                </a>

                <a href="#" class="menu-item">
                    <div class="menu-item-icon">
                        <i class="bi bi-calendar-event"></i>
                    </div>
                    <div class="menu-item-text">Events</div>
                </a>

                <a href="#" class="menu-item">
                    <div class="menu-item-icon">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <div class="menu-item-text">Inventory</div>
                </a>

                <a href="#" class="menu-item">
                    <div class="menu-item-icon">
                        <i class="bi bi-gift"></i>
                    </div>
                    <div class="menu-item-text">Packages</div>
                </a>

                <a href="#" class="menu-item">
                    <div class="menu-item-icon">
                        <i class="bi bi-people"></i>
                    </div>
                    <div class="menu-item-text">Customers</div>
                </a>

                <a href="#" class="menu-item">
                    <div class="menu-item-icon">
                        <i class="bi bi-cart3"></i>
                    </div>
                    <div class="menu-item-text">POS & Billing</div>
                </a>

                <a href="#" class="menu-item">
                    <div class="menu-item-icon">
                        <i class="bi bi-receipt"></i>
                    </div>
                    <div class="menu-item-text">Quotations</div>
                </a>

                <a href="#" class="menu-item">
                    <div class="menu-item-icon">
                        <i class="bi bi-bar-chart-line"></i>
                    </div>
                    <div class="menu-item-text">Reports</div>
                </a>

                <a href="#" class="menu-item">
                    <div class="menu-item-icon">
                        <i class="bi bi-gear"></i>
                    </div>
                    <div class="menu-item-text">Settings</div>
                </a>

            </div>

        </div>
        <div class="dashboard-content">

            <div class="dashboard-main">

                <section class="welcome-section">
                    <div class="welcome-content">

                        <p class="welcome-small">WELCOME BACK!</p>

                        <h1>Make Every Event</h1>

                        <h2>Unforgettable.</h2>

                        <p class="welcome-description">
                            Manage your decorations, bookings and
                            celebrations in one beautiful place.
                        </p>

                        <button class="primary-btn">
                            <i class="bi bi-plus-lg"></i>
                            Create New Event
                        </button>

                    </div>

                </section>

                <section class="stats-section">
                    <div class="stat-card events-stat">

                        <div class="stat-icon">
                            <i class="bi bi-calendar-event"></i>
                        </div>

                        <div class="stat-info">
                            <p>Total Events</p>
                            <h3>128</h3>
                            <span><i class="bi bi-graph-up-arrow"></i> 12% this month</span>
                        </div>

                    </div>
                </section>

                <section class="packages-section">
                </section>

            </div>

            <div class="dashboard-right">

                <section class="time-card">
                </section>

                <section class="quick-actions">
                </section>

                <section class="upcoming-events">
                </section>

            </div>

        </div>
    </div>
</body>

</html>
