
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Booking | Decora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body>

<div class="page-container">

    <header class="page-header">
        <a href="index.html" class="back-link">
            <i class="bi bi-arrow-left"></i> Dashboard
        </a>
        <div class="page-brand">Decora</div>
        <span class="page-label">EVENT MANAGEMENT</span>
    </header>

    <main class="page-content">

        <div class="page-title">
            <div>
                <span class="eyebrow">LET'S CREATE SOMETHING BEAUTIFUL</span>
                <h1>New Event Booking</h1>
                <p>Enter the event details to create a new booking.</p>
            </div>
            <div class="title-icon"><i class="bi bi-calendar-heart"></i></div>
        </div>

        <form id="bookingForm">

            <section class="form-card">
                <h3><i class="bi bi-person"></i> Customer Information</h3>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label>Customer Name *</label>
                        <input type="text" class="form-control" placeholder="Enter customer name" required>
                    </div>

                    <div class="col-md-6">
                        <label>Contact Number *</label>
                        <input type="tel" class="form-control" placeholder="07XXXXXXXX" required>
                    </div>

                    <div class="col-md-6">
                        <label>Email Address</label>
                        <input type="email" class="form-control" placeholder="example@email.com">
                    </div>

                    <div class="col-md-6">
                        <label>NIC / Customer ID</label>
                        <input type="text" class="form-control" placeholder="Enter NIC or customer ID">
                    </div>
                </div>
            </section>


            <section class="form-card">
                <h3><i class="bi bi-calendar-event"></i> Event Details</h3>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label>Event Name *</label>
                        <input type="text" class="form-control" placeholder="e.g. Nimal & Amaya Wedding" required>
                    </div>

                    <div class="col-md-6">
                        <label>Event Type *</label>
                        <select class="form-select" required>
                            <option value="">Select event type</option>
                            <option>Wedding</option>
                            <option>Birthday Party</option>
                            <option>Engagement</option>
                            <option>Anniversary</option>
                            <option>Corporate Event</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>Event Date *</label>
                        <input type="date" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label>Event Time *</label>
                        <input type="time" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label>Venue Name *</label>
                        <input type="text" class="form-control" placeholder="Enter venue name" required>
                    </div>

                    <div class="col-md-6">
                        <label>Venue Address</label>
                        <input type="text" class="form-control" placeholder="Enter venue address">
                    </div>

                    <div class="col-12">
                        <label>Special Requirements</label>
                        <textarea class="form-control" rows="3" placeholder="Enter additional event requirements..."></textarea>
                    </div>
                </div>
            </section>


            <section class="form-card">
                <h3><i class="bi bi-gift"></i> Decoration Package</h3>

                <div class="package-select-grid">

                    <label class="package-option">
                        <input type="radio" name="package" value="75000" required>
                        <div class="package-option-content">
                            <i class="bi bi-flower1"></i>
                            <h5>Wedding Deluxe</h5>
                            <p>Elegant floral stage decoration</p>
                            <strong>Rs. 75,000</strong>
                        </div>
                    </label>

                    <label class="package-option">
                        <input type="radio" name="package" value="35000">
                        <div class="package-option-content">
                            <i class="bi bi-balloon-heart"></i>
                            <h5>Birthday Magic</h5>
                            <p>Colorful balloon decoration</p>
                            <strong>Rs. 35,000</strong>
                        </div>
                    </label>

                    <label class="package-option">
                        <input type="radio" name="package" value="60000">
                        <div class="package-option-content">
                            <i class="bi bi-stars"></i>
                            <h5>Corporate Elegance</h5>
                            <p>Professional event decoration</p>
                            <strong>Rs. 60,000</strong>
                        </div>
                    </label>

                </div>
            </section>


            <section class="form-card">
                <h3><i class="bi bi-wallet2"></i> Payment Details</h3>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label>Advance Payment (Rs.)</label>
                        <input type="number" min="0" class="form-control" placeholder="Enter advance amount">
                    </div>

                    <div class="col-md-6">
                        <label>Payment Method</label>
                        <select class="form-select">
                            <option>Cash</option>
                            <option>Card</option>
                            <option>Bank Transfer</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>Booking Status</label>
                        <select class="form-select">
                            <option>Pending</option>
                            <option>Confirmed</option>
                        </select>
                    </div>

                </div>
            </section>


            <div class="form-actions">
                <a href="index.html" class="secondary-btn">Cancel</a>
                <button type="submit" class="primary-btn">
                    <i class="bi bi-check-circle"></i> Create Booking
                </button>
            </div>

        </form>
    </main>
</div>

<script>
document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Booking form completed! Database integration can be added next.");
});
</script>

</body>
</html>
