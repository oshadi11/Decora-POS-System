
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Booking | Decora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #24152F;
            color: #F6F0E8;
            padding: 35px 15px;
        }

        .booking-container {
            max-width: 1000px;
            margin: auto;
        }

        .page-heading {
            margin-bottom: 30px;
        }

        .page-heading h2 {
            font-weight: 600;
            color: #F6F0E8;
        }

        .page-heading p {
            color: #B9AEBF;
            margin-bottom: 0;
        }

        .booking-card {
            background: #49334F;
            border: 1px solid rgba(198, 166, 107, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .section-title {
            color: #C6A66B;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(246, 240, 232, 0.12);
        }

        .form-label {
            color: #F6F0E8;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            background: #35243D;
            border: 1px solid rgba(246, 240, 232, 0.18);
            color: #F6F0E8;
            border-radius: 8px;
            padding: 11px 13px;
            font-size: 13px;
        }

        .form-control:focus,
        .form-select:focus {
            background: #35243D;
            color: #F6F0E8;
            border-color: #C6A66B;
            box-shadow: 0 0 0 0.2rem rgba(198, 166, 107, 0.15);
        }

        .form-control::placeholder {
            color: #A99BAF;
        }

        .form-select option {
            background: #35243D;
            color: #F6F0E8;
        }

        .form-check-input {
            background-color: #35243D;
            border-color: #A99BAF;
        }

        .form-check-input:checked {
            background-color: #C6A66B;
            border-color: #C6A66B;
        }

        .package-option {
            background: #35243D;
            border: 1px solid rgba(246, 240, 232, 0.15);
            border-radius: 10px;
            padding: 18px;
            height: 100%;
        }

        .package-option h6 {
            color: #F6F0E8;
            font-size: 14px;
            font-weight: 600;
        }

        .package-price {
            color: #C6A66B;
            font-size: 17px;
            font-weight: 600;
        }

        .package-option .form-check {
            margin-top: 12px;
        }

        .package-option .form-check-label {
            color: #CFC4D2;
            font-size: 12px;
        }

        .btn-submit {
            background: #C6A66B;
            color: #24152F;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-submit:hover {
            background: #D8BB83;
            color: #24152F;
        }

        .btn-cancel {
            background: transparent;
            color: #F6F0E8;
            border: 1px solid rgba(246, 240, 232, 0.25);
            border-radius: 8px;
            padding: 12px 25px;
            font-size: 14px;
            text-decoration: none;
        }

        .btn-cancel:hover {
            background: rgba(246, 240, 232, 0.08);
            color: #F6F0E8;
        }

        @media (max-width: 576px) {
            .booking-card {
                padding: 20px;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .form-actions button,
            .form-actions a {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="booking-container">

        <div class="page-heading">
            <a href="index.html" class="text-decoration-none" style="color: #C6A66B; font-size: 13px;">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>

            <h2 class="mt-3">Create New Booking</h2>
            <p>Enter customer and event details to create a new decoration booking.</p>
        </div>

        <form id="bookingForm">

            <div class="booking-card">

                <h5 class="section-title">
                    <i class="bi bi-person me-2"></i>Customer Information
                </h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="customerName" class="form-label">Customer Name *</label>
                        <input type="text" class="form-control" id="customerName" placeholder="Enter customer name" required>
                    </div>

                    <div class="col-md-6">
                        <label for="customerId" class="form-label">NIC / Customer ID</label>
                        <input type="text" class="form-control" id="customerId" placeholder="Enter NIC or customer ID">
                    </div>

                    <div class="col-md-6">
                        <label for="phone" class="form-label">Phone Number *</label>
                        <input type="tel" class="form-control" id="phone" placeholder="Enter phone number" required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter email address">
                    </div>

                </div>
            </div>

            <div class="booking-card">

                <h5 class="section-title">
                    <i class="bi bi-calendar-event me-2"></i>Event Information
                </h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="eventName" class="form-label">Event Name *</label>
                        <input type="text" class="form-control" id="eventName" placeholder="Enter event name" required>
                    </div>

                    <div class="col-md-6">
                        <label for="eventType" class="form-label">Event Type *</label>
                        <select class="form-select" id="eventType" required>
                            <option value="" selected disabled>Select event type</option>
                            <option value="Wedding">Wedding</option>
                            <option value="Birthday">Birthday</option>
                            <option value="Engagement">Engagement</option>
                            <option value="Corporate Event">Corporate Event</option>
                            <option value="Anniversary">Anniversary</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="eventDate" class="form-label">Event Date *</label>
                        <input type="date" class="form-control" id="eventDate" required>
                    </div>

                    <div class="col-md-6">
                        <label for="eventTime" class="form-label">Event Time *</label>
                        <input type="time" class="form-control" id="eventTime" required>
                    </div>

                    <div class="col-md-6">
                        <label for="eventLocation" class="form-label">Venue Name *</label>
                        <input type="text" class="form-control" id="eventLocation" placeholder="Enter venue name" required>
                    </div>

                    <div class="col-md-6">
                        <label for="venueAddress" class="form-label">Venue Address</label>
                        <input type="text" class="form-control" id="venueAddress" placeholder="Enter venue address">
                    </div>

                    <div class="col-12">
                        <label for="specialRequirements" class="form-label">Special Requirements</label>
                        <textarea class="form-control" id="specialRequirements" rows="3" placeholder="Enter any additional requirements"></textarea>
                    </div>

                </div>
            </div>

            <div class="booking-card">

                <h5 class="section-title">
                    <i class="bi bi-gift me-2"></i>Select Decoration Package
                </h5>

                <div class="row g-3">

                    <div class="col-md-4">
                        <div class="package-option">
                            <h6>Wedding Deluxe</h6>
                            <p class="package-price mb-0">Rs. 75,000</p>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="package" id="weddingPackage" value="75000" required>
                                <label class="form-check-label" for="weddingPackage">
                                    Select Package
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="package-option">
                            <h6>Birthday Magic</h6>
                            <p class="package-price mb-0">Rs. 35,000</p>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="package" id="birthdayPackage" value="35000">
                                <label class="form-check-label" for="birthdayPackage">
                                    Select Package
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="package-option">
                            <h6>Corporate Elegance</h6>
                            <p class="package-price mb-0">Rs. 60,000</p>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="package" id="corporatePackage" value="60000">
                                <label class="form-check-label" for="corporatePackage">
                                    Select Package
                                </label>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="booking-card">

                <h5 class="section-title">
                    <i class="bi bi-credit-card me-2"></i>Payment Information
                </h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="advancePayment" class="form-label">Advance Payment (Rs.)</label>
                        <input type="number" class="form-control" id="advancePayment" placeholder="Enter advance amount" min="0" step="0.01" value="0">
                    </div>

                    <div class="col-md-6">
                        <label for="paymentMethod" class="form-label">Payment Method</label>
                        <select class="form-select" id="paymentMethod">
                            <option value="" selected disabled>Select payment method</option>
                            <option value="Cash">Cash</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Card">Card</option>
                            <option value="Online Payment">Online Payment</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="bookingStatus" class="form-label">Booking Status</label>
                        <select class="form-select" id="bookingStatus">
                            <option value="Pending" selected>Pending</option>
                            <option value="Confirmed">Confirmed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>

                </div>
            </div>

            <div class="d-flex justify-content-end gap-3 form-actions mb-5">
                <a href="dashboard.html" class="btn-cancel">Cancel</a>

                <button type="submit" class="btn-submit">
                    <i class="bi bi-check-circle me-2"></i>Create Booking
                </button>
            </div>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/booking.js"></script>

</body>
</html>
